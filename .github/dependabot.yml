version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/envs/dev
      - /infra/terraform/envs/prod
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Base images of every service image, including the re-published podinfo of services/smoke (ADR-0012): pinned by
  # digest, so they move only through these pull requests.
  - package-ecosystem: docker
    directories:
      - /services/*
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: build
