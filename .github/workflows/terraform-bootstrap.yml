# Account bootstrap: state bucket, GitHub OIDC provider, CI roles (infra/terraform/bootstrap).
# Prerequisite once per account: scripts/cloudshell-bootstrap.sh. The first run creates the bucket with local state,
# then migrates that state into the bucket; later runs use the bucket directly.
name: Terraform bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash
    working-directory: infra/terraform/bootstrap

concurrency:
  group: tf-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap account
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_github_repository: ${{ github.repository }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Init (bucket backend, or local on the first run)
        run: |
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="region=$REGION" \
              -backend-config="encrypt=true" -backend-config="use_lockfile=true"
            echo "FIRST_RUN=false" >> "$GITHUB_ENV"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
            terraform init -input=false
            echo "FIRST_RUN=true" >> "$GITHUB_ENV"
          fi
      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
      - name: Move state into the bucket (first run only)
        if: env.FIRST_RUN == 'true'
        run: |
          rm backend_override.tf
          terraform init -input=false -migrate-state -force-copy -backend-config="bucket=$BUCKET" \
            -backend-config="region=$REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          aws s3api head-object --bucket "$BUCKET" --key bootstrap/terraform.tfstate >/dev/null
          echo "State migrated to s3://$BUCKET/bootstrap/terraform.tfstate"
      - name: Summarise
        run: |
          {
            echo '### Bootstrap outputs'
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
