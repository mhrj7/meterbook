# Reusable: build one service image, generate its SBOM, and fail on fixable CRITICAL vulnerabilities.
# On main it also pushes to GHCR and signs the image and its SBOM attestation with keyless cosign (Sigstore),
# so the cluster can verify that every running image came from this pipeline.
name: Container

on:
  workflow_call:
    inputs:
      service:
        description: Directory name under services/ that contains a Dockerfile.
        type: string
        required: true
      publish:
        description: Push, sign and attest the image.
        type: boolean
        default: false

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.76.1

# Explicit bash runs every step with `-eo pipefail`, so a failing command piped into tee/grep fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build, scan, sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/meterbook-${{ inputs.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=pr

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ inputs.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Vulnerability gate (fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

      - name: Vulnerability report (HIGH and above, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          skip-setup-trivy: true

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:scan
          format: spdx-json
          output-file: sbom-${{ inputs.service }}.spdx.json
          artifact-name: sbom-${{ inputs.service }}.spdx.json

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (multi-arch)
        id: push
        if: inputs.publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish

      - name: Sign image and attest SBOM (keyless)
        if: inputs.publish
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SERVICE: ${{ inputs.service }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "sbom-${SERVICE}.spdx.json" "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
