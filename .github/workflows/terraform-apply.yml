# Applies an environment from main, through a protected GitHub environment (the apply role trusts only those).
#
# dev is disposable (ADR-0005): one job applies it, verifies it on real AWS and inside the cluster
# (tests/infra/verify-dev.sh), and destroys it again unless destroy_after is unchecked. Destroy runs even when apply or
# verification fail, so a broken run cannot leave paid resources behind. Everything runs in one job because the dev
# Kubernetes API only admits allow-listed IPs: this runner adds its own address for the length of the run.
#
# prod is applied without verification here (its Kubernetes API is private) and is never destroyed by CI.
name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, production]
        default: dev
      destroy_after:
        description: "dev only: destroy after verification"
        type: boolean
        default: true
      destroy_only:
        description: "dev only: skip apply and verification, destroy what is left (cleanup after a failed run)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Explicit bash runs every step with `-eo pipefail`, so a failing command piped into tee/grep fails the step.
defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_repository: ${{ github.repository }}

jobs:
  dev:
    name: Dev cycle (apply, verify, destroy)
    if: inputs.environment == 'dev' && vars.AWS_REGION != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 115
    concurrency:
      group: tf-dev
      cancel-in-progress: false
    defaults:
      run:
        # Job defaults replace the workflow defaults: repeat the shell, or pipefail is lost.
        shell: bash
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Allow this runner to reach the dev Kubernetes API
        env:
          ADMIN_CIDRS: ${{ secrets.TF_ADMIN_CIDRS }}
        run: |
          for cidr in $(jq -r '.[]' <<<"$ADMIN_CIDRS"); do
            echo "::add-mask::$cidr"
            echo "::add-mask::${cidr%/*}"
          done
          runner_ip=$(curl -sSf https://checkip.amazonaws.com | tr -d '[:space:]')
          cidrs=$(jq -cn --argjson base "$ADMIN_CIDRS" --arg ip "$runner_ip/32" '$base + [$ip] | unique')
          echo "TF_VAR_admin_cidrs=$cidrs" >> "$GITHUB_ENV"
      - name: Init
        id: init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Purge dev secrets left pending deletion
        if: ${{ !inputs.destroy_only }}
        # A secret name cannot be reused while it is scheduled for deletion. dev is disposable and its secrets are
        # empty shells, so leftovers from an interrupted run are removed before the apply recreates them.
        run: |
          arns=$(aws secretsmanager list-secrets --include-planned-deletion \
            --filters Key=name,Values=meterbook-dev/ \
            --query 'SecretList[?DeletedDate!=null].ARN' --output text)
          for arn in $arns; do
            echo "Purging $arn"
            aws secretsmanager delete-secret --secret-id "$arn" --force-delete-without-recovery >/dev/null
          done
          if [ -n "$arns" ]; then sleep 20; fi
      - name: Plan
        if: ${{ !inputs.destroy_only }}
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
      - name: Apply
        id: apply
        if: ${{ !inputs.destroy_only }}
        run: |
          start=$(date +%s)
          terraform apply -input=false -lock-timeout=5m tfplan
          echo "Apply took $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify (AWS baseline, GitOps, secrets delivery, workload hardening)
        if: ${{ !inputs.destroy_only }}
        working-directory: .
        env:
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: bash tests/infra/verify-dev.sh | tee verify.log
      - name: Summarise verification
        if: always() && steps.apply.outcome != 'skipped'
        working-directory: .
        run: |
          {
            echo '### Verification'
            echo '```'
            grep -E '^(PASS|FAIL|[0-9]+ passed)' verify.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy
        if: always() && (inputs.destroy_after || inputs.destroy_only) && steps.init.outcome == 'success'
        run: |
          start=$(date +%s)
          if ! terraform destroy -input=false -lock-timeout=5m -auto-approve; then
            # The VPC CNI can leave detached network interfaces behind when nodes go, and they block deleting the
            # subnets and security groups (DependencyViolation). Remove the detached ones in this VPC only, then
            # retry once.
            vpc_addr=$(terraform state list | grep -E 'aws_vpc\.this' | head -n1 || true)
            vpc=""
            if [ -n "$vpc_addr" ]; then
              vpc=$(terraform state show -no-color "$vpc_addr" | awk '$1 == "id" {gsub(/"/, "", $3); print $3; exit}')
            fi
            if [ -n "$vpc" ]; then
              enis=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$vpc" "Name=status,Values=available" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)
              for eni in $enis; do
                echo "Deleting detached network interface $eni"
                aws ec2 delete-network-interface --network-interface-id "$eni"
              done
              echo "Removed $(wc -w <<<"$enis") detached network interfaces before retrying" >> "$GITHUB_STEP_SUMMARY"
            fi
            terraform destroy -input=false -lock-timeout=5m -auto-approve
          fi
          echo "Destroy took $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          left=$(terraform state list | wc -l)
          echo "Resources left in state: $left" >> "$GITHUB_STEP_SUMMARY"
          [ "$left" -eq 0 ]

  production:
    name: Apply production
    if: inputs.environment == 'production' && vars.AWS_REGION != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    concurrency:
      group: tf-production
      cancel-in-progress: false
    defaults:
      run:
        # Job defaults replace the workflow defaults: repeat the shell, or pipefail is lost.
        shell: bash
        working-directory: infra/terraform/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 7200
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
