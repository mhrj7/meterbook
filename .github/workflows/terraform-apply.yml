# Applies infrastructure. dev applies automatically after merge to main; prod only by manual dispatch.
# Each job runs in a protected GitHub environment (required reviewers, main only) — the apply role trusts only
# those environments, so this workflow is the only way to change AWS.
name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, production]
        default: dev

permissions:
  contents: read
  id-token: write

# Explicit bash runs every step with `-eo pipefail`, so a failing command piped into tee/grep fails the step.
defaults:
  run:
    shell: bash

jobs:
  apply:
    name: Apply ${{ inputs.environment || 'dev' }}
    if: vars.TF_STATE_BUCKET != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: tf-apply-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ (inputs.environment || 'dev') == 'production' && 'prod' || 'dev' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_admin_cidrs: ${{ vars.TF_ADMIN_CIDRS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan
      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
