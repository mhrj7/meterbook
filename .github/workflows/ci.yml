# Runs on every pull request and on main. Jobs are skipped when the paths they guard did not change;
# the final "ci" job is the single required status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.1
  KUBECONFORM_VERSION: v0.8.0
  KUBE_LINTER_VERSION: v0.8.3
  TERRAFORM_VERSION: 1.13.5
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: v0.76.1
  SPECTRAL_IMAGE: stoplight/spectral:6.15.0
  OASDIFF_IMAGE: tufin/oasdiff:v1.34.0

# Explicit bash runs every step with `-eo pipefail`, so a failing command piped into tee/grep fails the step.
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      helm: ${{ steps.filter.outputs.helm }}
      secrets-e2e: ${{ steps.filter.outputs.secrets-e2e }}
      contracts: ${{ steps.filter.outputs.contracts }}
      gitops: ${{ steps.filter.outputs.gitops }}
      workflows: ${{ steps.filter.outputs.workflows }}
      services: ${{ steps.services.outputs.list }}
      java: ${{ steps.services.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            terraform:
              - 'infra/terraform/**'
              - 'infra/argocd/**'
              - '.github/workflows/ci.yml'
            helm:
              - 'infra/helm/**'
              - 'infra/keycloak/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            gitops:
              - 'infra/argocd/**'
              - 'infra/helm/**'
              - 'deploy/**'
              - 'scripts/gitops_policy.py'
              - 'scripts/tests/**'
              - 'tests/integration/gitops/**'
              - '.github/workflows/ci.yml'
            secrets-e2e:
              - 'infra/helm/platform-secrets/**'
              - 'tests/integration/secrets/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
      - id: services
        name: List changed services
        # A service is built when its directory, the shared pipelines or this workflow changed (every service on a
        # base we cannot compare with). Java services are the ones with a Gradle wrapper.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          shared='^\.github/workflows/(ci|container)\.yml$'
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE" HEAD)
          else
            changed=ALL
          fi
          pick() { # pick <marker file> [extra pattern]: changed service directories that contain it, as a JSON list
            find services -mindepth 2 -maxdepth 2 -name "$1" -printf '%h\n' 2>/dev/null | while read -r dir; do
              if [ "$changed" = ALL ] || grep -qE "^$dir/|$shared${2:+|$2}" <<<"$changed"; then basename "$dir"; fi
            done | sort | jq -R . | jq -cs .
          }
          # Java tests also cover the Keycloak realm (tokens are validated against it) and the API contracts.
          java_inputs='^infra/keycloak/|^contracts/'
          echo "list=$(pick Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "java=$(pick gradlew "$java_inputs")" >> "$GITHUB_OUTPUT"
          echo "Images: $(pick Dockerfile)  Java: $(pick gradlew "$java_inputs")"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Job defaults keep pipefail
        run: |
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 scripts/check_workflow_shells.py

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Job defaults replace the workflow defaults: repeat the shell, or pipefail is lost.
        shell: bash
        working-directory: infra/terraform
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Format
        run: make fmt
      - name: Validate (all roots and modules)
        run: make validate
      - name: No secret values in Terraform
        run: make no-secret-values
      - name: Unit tests (mocked providers)
        run: make test
      - name: Lint
        run: make lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          # Downloaded upstream modules (incl. their example manifests) live in .terraform/ after validate;
          # Trivy still evaluates those modules through our module calls.
          skip-dirs: "**/.terraform"
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  helm:
    name: Helm charts
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform and kube-linter
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" \
            | tar -xz -C /usr/local/bin kube-linter
      - name: Lint
        run: |
          helm dependency build infra/helm/meterbook-service
          # The service chart is linted with every service's values; other charts with their own values files.
          for values in deploy/services/*/*.yaml; do helm lint --strict infra/helm/meterbook-service -f "$values"; done
          helm dependency build infra/helm/identity-stack
          for chart in infra/helm/platform-secrets infra/helm/identity-stack; do
            for values in "$chart"/values-*.yaml; do helm lint --strict "$chart" -f "$values"; done
          done
      - name: Render tests
        run: |
          for t in infra/helm/*/tests/render_test.sh; do bash "$t"; done

  secrets-e2e:
    name: Secrets end-to-end (kind)
    needs: changes
    if: needs.changes.outputs.secrets-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: secrets-e2e
      - name: Run end-to-end test
        run: bash tests/integration/secrets/e2e.sh | tee e2e.log
      - name: Summarise
        if: always()
        run: |
          {
            echo '### Secrets end-to-end'
            echo '```'
            grep -E '^(PASS|FAIL|===|[0-9]+ passed)' e2e.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get externalsecrets,clustersecretstores -A -o wide || true
          kubectl -n external-secrets logs deploy/external-secrets --tail=100 || true

  gitops-policy:
    name: GitOps policy
    needs: changes
    if: needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the prod pin must be reachable from main
      - name: Install test dependencies
        run: python3 -m pip install --quiet pyyaml==6.0.3 pytest==9.1.1
      - name: Policy unit tests
        run: python3 -m pytest -q scripts/tests
      - name: Policy check on the repository
        run: python3 scripts/gitops_policy.py

  gitops-e2e:
    name: GitOps end-to-end (kind + ArgoCD)
    needs: changes
    # ArgoCD fetches this commit from GitHub without credentials, so the repository must be public.
    if: needs.changes.outputs.gitops == 'true' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: gitops-e2e
      - name: Run end-to-end test
        env:
          GITOPS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash tests/integration/gitops/e2e.sh | tee e2e.log
      - name: Summarise
        if: always()
        run: |
          {
            echo '### GitOps end-to-end'
            echo '```'
            grep -E '^(PASS|FAIL|===|[0-9]+ passed)' e2e.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  java:
    name: Java ${{ matrix.service }} (format, compile, test, coverage)
    needs: changes
    if: needs.changes.outputs.java != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.java) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Job defaults replace the workflow defaults: repeat the shell, or pipefail is lost.
        shell: bash
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Validates the checked-in wrapper jar against Gradle's published checksums and caches dependencies.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check (Spotless, Error Prone, tests, coverage gate)
        run: ./gradlew check --no-daemon
      - name: Summarise
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, xml.etree.ElementTree as ET
          tests = failures = 0
          for f in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests")); failures += int(r.get("failures")) + int(r.get("errors"))
          print(f"### Java {os.environ['SERVICE']}\n\n{tests} tests, {failures} failed")
          report = "build/reports/jacoco/test/jacocoTestReport.xml"
          if os.path.exists(report):
              for c in ET.parse(report).getroot().findall("counter"):
                  if c.get("type") in ("LINE", "BRANCH"):
                      m, cv = int(c.get("missed")), int(c.get("covered"))
                      print(f"- {c.get('type').lower()} coverage: {cv / (m + cv):.1%}")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports
          retention-days: 7

  sso-e2e:
    name: SSO end-to-end (browser, SAML IdP, SCIM)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.java), 'identity')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Job defaults replace the workflow defaults: repeat the shell, or pipefail is lost.
        shell: bash
        working-directory: services/identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('services/identity/gradle/libs.versions.toml') }}
      - name: Install Chromium
        run: ./gradlew playwrightInstall --no-daemon
      - name: SSO end-to-end (TC-PLT-001)
        run: ./gradlew e2eTest --no-daemon
      - name: Summarise
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("### SSO end-to-end\n")
          for f in glob.glob("build/test-results/e2eTest/*.xml"):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  status = "FAIL" if tc.find("failure") is not None else "pass"
                  print(f"- {status} {tc.get('name')} ({float(tc.get('time')):.1f} s)")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sso-e2e-reports
          path: services/identity/build/reports
          retention-days: 7

  containers:
    name: Container ${{ matrix.service }}
    # After the Java tests, so an image is only built (and on main, published) from code that passed them.
    needs: [changes, java]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.services != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container.yml
    with:
      service: ${{ matrix.service }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  contracts:
    name: Contracts (lint, breaking changes)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint (Spectral, api-standards rules)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo "$SPECTRAL_IMAGE"
          lint 'contracts/openapi/*.yaml' --ruleset contracts/.spectral.yaml --fail-severity=warn
      - name: No breaking changes against the base branch
        # A breaking change needs a new major version: a new file (identity-v2.yaml), which has no base to compare.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with"; exit 0
          fi
          mkdir -p /tmp/base
          for f in contracts/openapi/*.yaml; do
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              git show "$BASE:$f" > "/tmp/base/$(basename "$f")"
              echo "Comparing $f with $BASE"
              docker run --rm -v "$PWD:/repo" -v /tmp/base:/base -w /repo "$OASDIFF_IMAGE" \
                breaking "/base/$(basename "$f")" "$f" --fail-on ERR
            else
              echo "$f is new"
            fi
          done

  ci:
    name: ci
    if: always()
    needs: [changes, secrets, workflow-lint, contracts, java, sso-e2e, terraform, helm, secrets-e2e, gitops-policy, gitops-e2e, containers]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
