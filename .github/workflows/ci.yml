# Runs on every pull request and on main. Jobs are skipped when the paths they guard did not change;
# the final "ci" job is the single required status check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TERRAFORM_VERSION: 1.13.5
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: v0.76.1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      workflows: ${{ steps.filter.outputs.workflows }}
      services: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            terraform:
              - 'infra/terraform/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
      - id: services
        name: List services with a Dockerfile
        run: |
          list=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' 2>/dev/null \
            | xargs -r -n1 basename | sort | jq -R . | jq -cs .)
          echo "list=${list:-[]}" >> "$GITHUB_OUTPUT"
          echo "Services: ${list:-[]}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Format
        run: make fmt
      - name: Validate (all roots and modules)
        run: make validate
      - name: Unit tests (mocked providers)
        run: make test
      - name: Lint
        run: make lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          # Downloaded upstream modules (incl. their example manifests) live in .terraform/ after validate;
          # Trivy still evaluates those modules through our module calls.
          skip-dirs: "**/.terraform"
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}

  containers:
    name: Container ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container.yml
    with:
      service: ${{ matrix.service }}
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  ci:
    name: ci
    if: always()
    needs: [changes, secrets, workflow-lint, terraform, containers]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
