# Platform smoke test: proves the GitOps path and the hardened chart end to end on every cluster sync.
# podinfo, a small, well-known demo service that runs as non-root with a read-only filesystem, re-published and
# signed by our pipeline (services/smoke, ADR-0012).
name: smoke
image:
  repository: ghcr.io/mhrj7/meterbook-smoke
  tag: "6.15.0"          # podinfo's version; the digest below is what deploys
  digest: "sha256:a8b58c8ac33f565decf9ea7325146647f273e55c3dd21a57850f8c02013bfd19"
containerPort: 9898
# The image has no ENTRYPOINT (only CMD ./podinfo), so args alone would replace the binary: set both.
command: ["./podinfo"]
args: ["--port=9898", "--level=info"]
probes:
  startup:
    path: /healthz
    failureThreshold: 30
  liveness:
    path: /healthz
  readiness:
    path: /readyz
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 64Mi
autoscaling:
  enabled: false
replicas: 2
