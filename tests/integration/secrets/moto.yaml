# Local stand-in for AWS Secrets Manager (moto server), used only by the end-to-end test.
apiVersion: v1
kind: Namespace
metadata:
  name: moto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: moto
spec:
  replicas: 1
  selector:
    matchLabels: { app: moto }
  template:
    metadata:
      labels: { app: moto }
    spec:
      containers:
        - name: moto
          image: motoserver/moto:5.2.4
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket: { port: 5000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: moto
spec:
  selector: { app: moto }
  ports:
    - port: 5000
      targetPort: 5000
