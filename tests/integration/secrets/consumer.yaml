# A workload that reads the synced secret at runtime, the way Meterbook services will.
apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: meterbook
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: consumer
      image: busybox:1.37
      command: ["sh", "-c", "echo \"key=${STRIPE_API_KEY}\"; sleep 3600"]
      env:
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: stripe
              key: STRIPE_API_KEY
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
