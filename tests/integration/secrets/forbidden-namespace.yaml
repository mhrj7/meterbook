# An ExternalSecret in a namespace the ClusterSecretStore does not allow. ESO must refuse to sync it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stolen
  namespace: other
spec:
  refreshInterval: 5s
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: stolen
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: meterbook-ci/stripe-api-key
