spring:
  application:
    name: identity
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      # The contract forbids unknown fields (additionalProperties: false); a typo must not be ignored silently.
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meterbook}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:}
    hikari:
      # The schema is a driver property, not part of the URL, so it holds wherever the URL comes from.
      data-source-properties:
        currentSchema: identity
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    schemas: identity
    default-schema: identity
    create-schemas: true
  jooq:
    sql-dialect: postgres
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is Keycloak's public URL (what tokens say); the JWKS is fetched over the internal URL.
          # With both set, nothing is fetched at start-up, so the service starts while Keycloak is down.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/meterbook}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/meterbook/protocol/openid-connect/certs}
          audiences: meterbook-api

identity:
  keycloak:
    base-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: meterbook
    client-id: meterbook-identity
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    timeout: 2s
  sso:
    public-issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
    allow-insecure-idp-urls: ${SSO_ALLOW_INSECURE_IDP_URLS:false}

server:
  port: 8080
  shutdown: graceful

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        traceId: trace_id
        spanId: span_id

management:
  server:
    # Metrics and actuator endpoints stay off the API port; only the probes are added to it.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
