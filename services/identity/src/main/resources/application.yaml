spring:
  application:
    name: identity
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is Keycloak's public URL (what tokens say); the JWKS is fetched over the internal URL.
          # With both set, nothing is fetched at start-up, so the service starts while Keycloak is down.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/meterbook}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/meterbook/protocol/openid-connect/certs}
          audiences: meterbook-api

server:
  port: 8080
  shutdown: graceful

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        traceId: trace_id
        spanId: span_id

management:
  server:
    # Metrics and actuator endpoints stay off the API port; only the probes are added to it.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
