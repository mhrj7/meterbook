# Versions not managed by Spring Boot's BOM. Spring Boot manages Spring, Jackson, jOOQ, Flyway, PostgreSQL,
# Testcontainers, JUnit, Micrometer and OpenTelemetry (ADR-0008).
[versions]
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
spotless = "8.10.4"
errorprone-plugin = "5.1.1"
errorprone = "2.51.0"
# 1.37.0 fails inside Spotless 8.10.4 (InvocationTargetException on every file); revisit with the next Spotless.
google-java-format = "1.36.0"
jacoco = "0.8.14"
# 1.64.0 is less than two weeks old.
playwright = "1.63.0"
# Must equal the jOOQ version Spring Boot manages.
jooq = "3.21.9"
pitest-plugin = "1.19.0"
# 1.30.1 is less than two weeks old.
pitest-core = "1.30.0"
pitest-junit5 = "1.2.3"
# 6.5.13 is less than two weeks old.
spotbugs-plugin = "6.5.12"
spotbugs-core = "4.10.4"

[libraries]
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
