# Application namespaces: enrolled in the ambient mesh and checked by the image policies. Platform namespaces
# (argocd, external-secrets, kube-system, istio-system, cosign-system) stay outside both.
namespaces: []
# Istio's root namespace: a PeerAuthentication there applies to the whole mesh.
rootNamespace: istio-system

# Images the application namespaces may run (ADR-0012). Each needs a keyless Sigstore signature from the named
# GitHub Actions workflow; any image matching no policy is refused (no-match-policy: deny). Third-party images (the
# smoke service's podinfo) are re-published and signed by our own pipeline, so one policy covers everything.
imagePolicies:
  - name: meterbook-images
    glob: "ghcr.io/mhrj7/**"
    # Built, scanned and signed on main by this repository's container workflow (ADR-0003).
    subjectRegExp: '^https://github\.com/mhrj7/meterbook/\.github/workflows/container\.yml@refs/heads/main$'
