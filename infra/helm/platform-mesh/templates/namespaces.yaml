{{- /*
Enrols each application namespace in the ambient mesh. Other Applications create these namespaces too
(CreateNamespace=true); server-side apply lets this chart own only the label, and Delete=false keeps a prune from
ever deleting a namespace with everything in it.
*/}}
{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    istio.io/dataplane-mode: ambient
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,ServerSideApply=true
{{- end }}
