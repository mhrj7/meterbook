# identity-stack in meterbook-staging.
environment: staging
databaseSecretEnvironment: dev

# Image digests: images built and signed on main by container.yml (cosign keyless); bump each with its own PR.
dbBootstrap:
  image:
    digest: "sha256:a25b9e89c41cd2bf12d4b15a21cf499dd0fb7ab451a32aaeda9124b0fd2a6972"

keycloak:
  image:
    digest: "sha256:f76d24bfc6f170ef82d8f2ffa8c09f565f217659c92a372b315d51b27438d7f9"
  env:
    - {name: KC_HOSTNAME, value: "http://keycloak.meterbook-staging.svc.cluster.local"}
    - {name: KC_HTTP_ENABLED, value: "true"}
    - {name: KC_HTTP_PORT, value: "8080"}
    - {name: KC_DB_URL_DATABASE, value: keycloak_staging}
    - {name: KC_DB_USERNAME, value: keycloak_staging}
    - {name: KC_DB_URL_PROPERTIES, value: "?sslmode=require"}
    - name: KC_DB_URL_HOST
      valueFrom: {secretKeyRef: {name: database, key: DB_HOST}}
    - name: KC_DB_URL_PORT
      valueFrom: {secretKeyRef: {name: database, key: DB_PORT}}
    - name: KC_DB_PASSWORD
      valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}
    - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: bootstrap-admin}
    - {name: KC_LOG_CONSOLE_OUTPUT, value: json}
    - {name: MB_PORTAL_URL, value: "http://portal.meterbook-staging.svc.cluster.local"}

identity:
  image:
    digest: "sha256:050d9106464a9841098ed35089228895e8d5d3bafc2dabbaca21bf77e98cf361"
  env:
    - {name: KEYCLOAK_URL, value: "http://keycloak.meterbook-staging.svc.cluster.local"}
    - {name: KEYCLOAK_ISSUER, value: "http://keycloak.meterbook-staging.svc.cluster.local/realms/meterbook"}
    - {name: KEYCLOAK_JWKS_URI, value: "http://keycloak.meterbook-staging.svc.cluster.local/realms/meterbook/protocol/openid-connect/certs"}
    - name: KEYCLOAK_CLIENT_SECRET
      valueFrom: {secretKeyRef: {name: keycloak-clients, key: MB_IDENTITY_CLIENT_SECRET}}
    - name: DB_HOST
      valueFrom: {secretKeyRef: {name: database, key: DB_HOST}}
    - name: DB_PORT
      valueFrom: {secretKeyRef: {name: database, key: DB_PORT}}
    - {name: DB_URL, value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/identity_staging?sslmode=require"}
    - {name: DB_USERNAME, value: identity_staging}
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: identity-db, key: password}}
    - {name: TRACING_SAMPLING_PROBABILITY, value: "1.0"}
