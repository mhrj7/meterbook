# identity-stack in meterbook-prod.
environment: prod
databaseSecretEnvironment: prod  # prod has its own RDS instance

# Image digests: images built and signed on main by container.yml (cosign keyless); prod moves with promotion.
dbBootstrap:
  image:
    digest: "sha256:04cb581dc4bdc7f448b21ac298b2fead367efd7fe25c1324f820eb166be54896"

keycloak:
  image:
    digest: "sha256:4ce7aa79067bcb6f2d3302f1060ccb80bee9a115eed7b7926504881fc883faf8"
  env:
    - {name: KC_HOSTNAME, value: "http://keycloak.meterbook-prod.svc.cluster.local"}
    - {name: KC_HTTP_ENABLED, value: "true"}
    - {name: KC_HTTP_PORT, value: "8080"}
    - {name: KC_DB_URL_DATABASE, value: keycloak_prod}
    - {name: KC_DB_USERNAME, value: keycloak_prod}
    - {name: KC_DB_URL_PROPERTIES, value: "?sslmode=require"}
    - name: KC_DB_URL_HOST
      valueFrom: {secretKeyRef: {name: database, key: DB_HOST}}
    - name: KC_DB_URL_PORT
      valueFrom: {secretKeyRef: {name: database, key: DB_PORT}}
    - name: KC_DB_PASSWORD
      valueFrom: {secretKeyRef: {name: keycloak-db, key: password}}
    - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: bootstrap-admin}
    - {name: KC_LOG_CONSOLE_OUTPUT, value: json}
    - {name: MB_PORTAL_URL, value: "http://portal.meterbook-prod.svc.cluster.local"}
  # Two replicas on different nodes, clustered through the database (JDBC_PING); a PDB keeps one up during drains.
  replicas: 2
  pdb: {enabled: true}

identity:
  image:
    digest: "sha256:fa3349d3befe2dcfeeb93e0e61a4b89b54a426b3c7c8eced6bf1f334112ceb1e"
  env:
    - {name: KEYCLOAK_URL, value: "http://keycloak.meterbook-prod.svc.cluster.local"}
    - {name: KEYCLOAK_ISSUER, value: "http://keycloak.meterbook-prod.svc.cluster.local/realms/meterbook"}
    - {name: KEYCLOAK_JWKS_URI, value: "http://keycloak.meterbook-prod.svc.cluster.local/realms/meterbook/protocol/openid-connect/certs"}
    - name: KEYCLOAK_CLIENT_SECRET
      valueFrom: {secretKeyRef: {name: keycloak-clients, key: MB_IDENTITY_CLIENT_SECRET}}
    - name: DB_HOST
      valueFrom: {secretKeyRef: {name: database, key: DB_HOST}}
    - name: DB_PORT
      valueFrom: {secretKeyRef: {name: database, key: DB_PORT}}
    - {name: DB_URL, value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/identity_prod?sslmode=require"}
    - {name: DB_USERNAME, value: identity_prod}
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: identity-db, key: password}}
    - {name: TRACING_SAMPLING_PROBABILITY, value: "0.1"}
  replicas: 2
  pdb: {enabled: true}
