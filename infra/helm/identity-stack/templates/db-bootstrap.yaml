{{- $env := include "identity-stack.env" . -}}
{{- $img := .Values.dbBootstrap.image -}}
{{- if not (hasPrefix "sha256:" (toString $img.digest)) }}{{ fail "dbBootstrap.image.digest must be a sha256 digest" }}{{ end -}}
# Creates keycloak_<env> and identity_<env> (role and database) before the workloads start: an ArgoCD Sync hook in
# wave -1, after the secrets (wave -2) and before the Deployments (wave 0). Its role reads only the RDS master
# credentials (Terraform: aws_iam_role.db_bootstrap, bound to this service account by Pod Identity).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-bootstrap
  labels: {{- include "identity-stack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap
  labels: {{- include "identity-stack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-bootstrap
        {{- include "identity-stack.labels" . | nindent 8 }}
    spec:
      serviceAccountName: db-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ printf "%s@%s" $img.repository $img.digest }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: {{ .Values.region }}
            - name: PGSSLMODE
              value: require
            - name: DATABASES
              value: {{ printf "keycloak_%s:keycloak_%s:KEYCLOAK_DB_PASSWORD identity_%s:identity_%s:IDENTITY_DB_PASSWORD" $env $env $env $env | quote }}
            {{- range $var, $key := dict "DB_HOST" "DB_HOST" "DB_PORT" "DB_PORT" "MASTER_SECRET_ARN" "MASTER_SECRET_ARN" }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef: {name: database, key: {{ $key }}}
            {{- end }}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: password}
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: identity-db, key: password}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
