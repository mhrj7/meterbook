{{- $env := include "identity-stack.env" . -}}
# Generated credentials (refreshPolicy CreatedOnce: made once, never rotated by accident) and the database
# location published by Terraform. Synced before anything that uses them (sync wave -2).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: identity-stack
  labels: {{- include "identity-stack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database
  labels: {{- include "identity-stack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: database
  data:
    {{- range $key, $property := dict "DB_HOST" "host" "DB_PORT" "port" "MASTER_SECRET_ARN" "master_secret_arn" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "meterbook-%s/database" ($.Values.databaseSecretEnvironment | default $env) }}
        property: {{ $property }}
    {{- end }}
{{- range $name, $keys := dict
      "keycloak-db" (list "password")
      "identity-db" (list "password")
      "keycloak-clients" (list "MB_IDENTITY_CLIENT_SECRET" "MB_OPERATOR_CLIENT_SECRET")
      "keycloak-admin" (list "KC_BOOTSTRAP_ADMIN_PASSWORD") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels: {{- include "identity-stack.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
  dataFrom:
    {{- range $keys }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: identity-stack
      rewrite:
        - regexp:
            source: "^password$"
            target: {{ . }}
    {{- end }}
{{- end }}
