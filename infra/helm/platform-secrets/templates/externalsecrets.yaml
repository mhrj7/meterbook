{{- range .Values.externalSecrets }}
{{- if not (has .namespace $.Values.store.allowedNamespaces) }}
{{- fail (printf "externalSecrets %q is in namespace %q, which is not in store.allowedNamespaces" .name .namespace) }}
{{- end }}
{{- if not .data }}
{{- fail (printf "externalSecrets %q has no data entries" .name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    {{- include "platform-secrets.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.store.name }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    # Keep the last good value if the remote secret disappears, instead of breaking running services.
    deletionPolicy: Retain
  data:
    {{- range .data }}
    - secretKey: {{ required "data[].secretKey is required" .secretKey }}
      remoteRef:
        key: {{ required "data[].remoteKey is required" .remoteKey }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
