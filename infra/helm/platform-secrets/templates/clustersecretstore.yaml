{{- if not .Values.store.allowedNamespaces }}
{{- fail "store.allowedNamespaces must list at least one namespace: an unrestricted store lets any namespace read every secret" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "platform-secrets.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaces:
        {{- range .Values.store.allowedNamespaces }}
        - {{ . | quote }}
        {{- end }}
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
      # No auth block: ESO uses its EKS Pod Identity role (least-privilege, see modules/app-secrets).
