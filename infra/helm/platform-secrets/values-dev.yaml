region: us-east-1

store:
  allowedNamespaces:
    - meterbook

externalSecrets:
  - name: stripe
    namespace: meterbook
    data:
      - secretKey: STRIPE_API_KEY
        remoteKey: meterbook-dev/stripe-api-key
      - secretKey: STRIPE_WEBHOOK_SIGNING_SECRET
        remoteKey: meterbook-dev/stripe-webhook-signing-secret
  - name: identity-oidc
    namespace: meterbook
    data:
      - secretKey: OIDC_CLIENT_SECRET
        remoteKey: meterbook-dev/identity-oidc-client-secret
  # Database credentials (the RDS-managed secret) are wired in MB-T06 from the Terraform output database.secret_arn.
