region: eu-north-1

store:
  allowedNamespaces:
    - meterbook-prod

externalSecrets:
  - name: stripe
    namespace: meterbook-prod
    data:
      - secretKey: STRIPE_API_KEY
        remoteKey: meterbook-prod/stripe-api-key
      - secretKey: STRIPE_WEBHOOK_SIGNING_SECRET
        remoteKey: meterbook-prod/stripe-webhook-signing-secret
  - name: identity-oidc
    namespace: meterbook-prod
    data:
      - secretKey: OIDC_CLIENT_SECRET
        remoteKey: meterbook-prod/identity-oidc-client-secret
  # Database credentials (the RDS-managed secret) are wired in MB-T06 from the Terraform output database.secret_arn.
