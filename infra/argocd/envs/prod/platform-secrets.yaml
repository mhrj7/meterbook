# PROD: every git source is pinned to one commit SHA; change it only with scripts/promote-prod.sh (ADR-0006).
# platform-secrets for prod: ExternalSecrets in meterbook-prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-prod
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/mhrj7/meterbook.git
    targetRevision: 2c2a5655e7bc3d08b802a026b78a35fa2cd792c2
    path: infra/helm/platform-secrets
    helm:
      releaseName: platform-secrets-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: meterbook-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ExternalSecret CRDs come from platform-external-secrets; retry until they exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
