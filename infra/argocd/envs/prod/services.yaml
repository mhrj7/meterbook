# PROD: every git source is pinned to one commit SHA; change it only with scripts/promote-prod.sh (ADR-0006).
# One Application per service: every deploy/services/<name>/prod.yaml becomes <name>-prod, rendered with the shared
# meterbook-service chart into namespace meterbook-prod.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mhrj7/meterbook.git
        revision: 2c2a5655e7bc3d08b802a026b78a35fa2cd792c2
        files:
          - path: "deploy/services/*/prod.yaml"
  template:
    metadata:
      name: "{{ .path.basename }}-prod"
    spec:
      project: meterbook-apps
      source:
        repoURL: https://github.com/mhrj7/meterbook.git
        targetRevision: 2c2a5655e7bc3d08b802a026b78a35fa2cd792c2
        path: infra/helm/meterbook-service
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../../{{ .path.path }}/prod.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: meterbook-prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
