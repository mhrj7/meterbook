# PROD: every git source is pinned to one commit SHA; change it only with scripts/promote-prod.sh (ADR-0006).
# Istio in ambient mode, once per cluster (ADR-0011): CRDs, istiod, the CNI agent and ztunnel, then strict mTLS and
# the enrolled namespaces (platform-mesh). Charts from Istio's OCI registry; images from Google's Docker Hub mirror,
# since Istio 1.31 publishes images to Docker Hub only and Docker Hub throttles anonymous pulls.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: platform
  source:
    repoURL: ghcr.io/istio/release/charts
    chart: base
    targetRevision: 1.31.3
    helm:
      releaseName: istio-base
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod sets the validator's failurePolicy once it is serving.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.failurePolicy
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-14"
spec:
  project: platform
  source:
    repoURL: ghcr.io/istio/release/charts
    chart: istiod
    targetRevision: 1.31.3
    helm:
      releaseName: istiod
      valuesObject:
        profile: ambient
        global:
          hub: mirror.gcr.io/istio
        # Two replicas in prod (the chart's PDB keeps one during drains); ztunnel also keeps its last configuration.
        autoscaleEnabled: false
        replicaCount: 2
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 1Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod writes its CA into the webhooks and flips the validator's failurePolicy itself.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.failurePolicy
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-14"
spec:
  project: platform
  source:
    repoURL: ghcr.io/istio/release/charts
    chart: cni
    targetRevision: 1.31.3
    helm:
      releaseName: istio-cni
      valuesObject:
        profile: ambient
        global:
          hub: mirror.gcr.io/istio
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ztunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-13"
spec:
  project: platform
  source:
    repoURL: ghcr.io/istio/release/charts
    chart: ztunnel
    targetRevision: 1.31.3
    helm:
      releaseName: ztunnel
      valuesObject:
        hub: mirror.gcr.io/istio
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-12"
spec:
  project: platform
  source:
    repoURL: https://github.com/mhrj7/meterbook.git
    targetRevision: ba21d34205a3a5378634b970a6848bdced4e5e7d
    path: infra/helm/platform-mesh
    helm:
      releaseName: platform-mesh
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The PeerAuthentication CRD comes from platform-istio-base; retry until it exists.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
