# One Application per service: every deploy/services/<name>/dev.yaml becomes <name>-dev, rendered with the shared
# meterbook-service chart into namespace meterbook-dev.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mhrj7/meterbook.git
        revision: main
        files:
          - path: "deploy/services/*/dev.yaml"
  template:
    metadata:
      name: "{{ .path.basename }}-dev"
    spec:
      project: meterbook-apps
      source:
        repoURL: https://github.com/mhrj7/meterbook.git
        targetRevision: main
        path: infra/helm/meterbook-service
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - "../../../{{ .path.path }}/dev.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: meterbook-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
        syncOptions:
          - CreateNamespace=true
