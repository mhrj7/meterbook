# platform-secrets for dev: ExternalSecrets in meterbook-dev. Creates the cluster-wide store
# shared with staging. dev follows main without self-heal, so engineers may experiment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-dev
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/mhrj7/meterbook.git
    targetRevision: main
    path: infra/helm/platform-secrets
    helm:
      releaseName: platform-secrets-dev
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: meterbook-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      # The ExternalSecret CRDs come from platform-external-secrets; retry until they exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
