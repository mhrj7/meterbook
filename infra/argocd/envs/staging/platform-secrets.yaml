# platform-secrets for staging: ExternalSecrets in meterbook-staging. Reuses the store created by dev
# (same cluster). staging follows main strictly: drift is reverted.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets-staging
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/mhrj7/meterbook.git
    targetRevision: main
    path: infra/helm/platform-secrets
    helm:
      releaseName: platform-secrets-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: meterbook-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ExternalSecret CRDs come from platform-external-secrets; retry until they exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
