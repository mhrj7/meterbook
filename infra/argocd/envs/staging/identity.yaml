# Keycloak and the identity service in meterbook-staging (MB-T07): secrets, database bootstrap, then the workloads,
# ordered by sync waves inside the chart (infra/helm/identity-stack/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-staging
  namespace: argocd
spec:
  project: meterbook-apps
  source:
    repoURL: https://github.com/mhrj7/meterbook.git
    targetRevision: main
    path: infra/helm/identity-stack
    helm:
      releaseName: identity
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: meterbook-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ExternalSecret and generator CRDs come from platform-external-secrets; retry until they exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
