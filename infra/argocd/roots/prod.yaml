# Root app-of-apps for prod. Tracks main; reads infra/argocd/projects, infra/argocd/envs/prod.
# Created by Terraform (infra/terraform/modules/gitops); never edited in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meterbook-prod-root
  namespace: argocd
spec:
  project: bootstrap
  sources:
    - repoURL: https://github.com/mhrj7/meterbook.git
      targetRevision: main
      path: infra/argocd/projects
    - repoURL: https://github.com/mhrj7/meterbook.git
      targetRevision: main
      path: infra/argocd/envs/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
