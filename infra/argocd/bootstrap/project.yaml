# Project for the root Applications only: they may create ArgoCD objects in the argocd namespace and nothing else.
# Created by Terraform (infra/terraform/modules/gitops) together with the roots.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
spec:
  description: Root app-of-apps; manages ArgoCD Applications, ApplicationSets and AppProjects only
  sourceRepos:
    - https://github.com/mhrj7/meterbook.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
    - group: argoproj.io
      kind: AppProject
